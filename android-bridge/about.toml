# cargo-about 配置：生成随 APK 分发的 Rust 依赖许可清单。
# 用法见仓库根目录 README 的「第三方许可清单」一节。
#
# 注意：accepted 是 cargo-about 的顶层键，不是 [licenses] 段。

# 只统计真正会进 libiso2god.so 的依赖，避免混入 Windows 等其它目标的 crate
targets = ["aarch64-linux-android"]

# 接受的许可白名单。清单里出现白名单之外的许可时 cargo-about 会报错，
# 这是有意的——新依赖引入新许可时应当被注意到。
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "0BSD",
]

# 构建脚本与测试依赖不会链接进二进制
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 本项目自身（publish = false）不属于第三方组件
private = { ignore = true }

# 上游 iso2god 的 Cargo.toml 没有声明 license 字段（只有 name/version/description/
# repository/edition），因此必须在这里澄清，否则 cargo-about 直接报错。
# crate 专属配置必须放在文件最后，且 clarify 只能写成子表——内联表无法再追加
# [[...files]]，会被 TOML 拒绝。
#
# checksum 是上游仓库 LICENSE 文件的 sha-256（1072 字节）。若上游换用其它 LICENSE
# 文件，这里必须同步更新，
# 校验和不匹配时 cargo-about 会忽略该澄清并报错。
[iso2god.clarify]
license = "MIT"

[[iso2god.clarify.files]]
path = "LICENSE"
checksum = "5db9fd9302f45c0c550564d5b276d3fca24c72f861dd96e5743a99e2b2b56fc1"
