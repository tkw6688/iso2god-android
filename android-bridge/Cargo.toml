[package]
name = "iso2god-android-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# 产物名必须是 libiso2god.so —— MainActivity 里的 System.loadLibrary("iso2god") 依赖它
name = "iso2god"
crate-type = ["cdylib"]

[dependencies]
# 转换内核。上游未发布到 crates.io，只能按 git rev 锁定；rev 即上游 v1.8.0 的 commit。
# 依赖用 package 重命名，避免与上面 [lib] name = "iso2god" 撞名。
iso2god-src = { package = "iso2god", git = "https://github.com/iliazeus/iso2god-rs", rev = "06635a11fc295d167765fc7dcd5cc162eef122b3" }
jni = "0.21"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
